name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Placeholder values so the app's env validation passes in CI.
  DATABASE_URL: postgresql://jeevan:jeevan_dev_password@localhost:5432/jeevan_cars_test?schema=public
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-1234

jobs:
  checks:
    name: Lint, typecheck, format, unit + integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jeevan
          POSTGRES_PASSWORD: jeevan_dev_password
          POSTGRES_DB: jeevan_cars_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jeevan" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npx prisma migrate deploy
      - run: npm test

  e2e:
    name: End-to-end (production build)
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jeevan
          POSTGRES_PASSWORD: jeevan_dev_password
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jeevan" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # The Cloudinary upload spec runs only when these repository secrets exist.
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      CLOUDINARY_FOLDER: jeevan-cars-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7
